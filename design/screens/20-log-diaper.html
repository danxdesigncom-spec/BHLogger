<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S20 Log diaper with pale-stool notice · Behavior Logger mockup</title>
<!-- Design mockup (Log diaper, Maya). Reference for layout, sizes, colors and copy; not production code. Spec: docs/DESIGN.md · Screen notes: docs/SCREENS.md, S20 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1A2E}a:hover{color:#000000}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>
html{background:#E7E3EE}
body{margin:0 !important;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 32px;box-sizing:border-box;background:#E7E3EE !important;font-family:'Nunito',system-ui,sans-serif}
.mock-bar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#3D3654}
.mock-bar a{color:#3B21B8;font-weight:800;text-decoration:none}
.mock-bar b{color:#1F1A2E}
.mock-frame{flex:none;box-shadow:0 10px 30px rgba(31,26,46,.18);border-radius:28px;overflow:hidden}
</style>
</head>
<body>
<div class="mock-bar"><a href="index.html">All screens</a><span><b>S20</b> · Log diaper with pale-stool notice · MVP</span></div>
<div class="mock-frame" data-screen="S20">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F1FC; color: #1F1A2E; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31, 26, 46, 0.42)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 32px 32px 0 0">
    <div aria-hidden="true" style="width: 40px; height: 5px; flex: none; align-self: center; margin-top: 10px; border-radius: 3px; background: #D9D2EA"></div>

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 4px 20px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #DCEBFF; color: #1D4F91; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3c2.8 3.4 6 7.4 6 11a6 6 0 0 1-12 0c0-3.6 3.2-7.6 6-11z"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 id="sheet-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.1">Diaper</h1>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5B5470"><span style="width: 10px; height: 10px; border-radius: 50%; background: #0F766E"></span>for Maya</span>
        </div>
      </div>
      <a href="18-home-baby.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #F5F1FC; color: #1F1A2E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 0 20px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">What's in the diaper?</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="false" style="min-height: 60px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Wet</button>
          <button type="button" aria-pressed="true" style="min-height: 60px; display: flex; align-items: center; justify-content: center; gap: 4px; border-radius: 20px; border: 1.5px solid #0F766E; background: #0F766E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Dirty</button>
          <button type="button" aria-pressed="false" style="min-height: 60px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Both</button>
          <button type="button" aria-pressed="false" style="min-height: 60px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer">Dry</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">Consistency</h2>
          <span style="font-size: 13px; color: #5B5470">Infant scale</span>
        </div>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" style="color: #6B4A2E"><path d="M5 10c3-2.5 6 2.5 9 0s6 2.5 9 0 6 2.5 9 0"></path><path d="M5 16c3-2.5 6 2.5 9 0s6 2.5 9 0 6 2.5 9 0"></path></svg>Watery</button>
          <button type="button" aria-pressed="true" style="position: relative; min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; border: 2px solid #0F766E; background: #DDECEB; color: #0B5A54; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer"><span style="position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><svg class="i" viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" style="color: #6B4A2E"><path d="M10 18c-4 0-4.5-5.5 0-6 0-4 5-5 7.5-2.5 2-3 8.5-3 9.5 1 3.5-.5 6 5.5 1 7.5z"></path></svg>Soft</button>
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" style="color: #6B4A2E"><path d="M8 8h24a4 4 0 0 1 0 8H8a4 4 0 0 1 0-8z"></path></svg>Formed</button>
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 13px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 40 24" width="40" height="24" aria-hidden="true" style="color: #6B4A2E"><circle cx="10" cy="12" r="4"></circle><circle cx="20" cy="12" r="4"></circle><circle cx="30" cy="12" r="4"></circle></svg>Hard</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">Color</h2>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px">
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #E3B53B"></span>Yellow</button>
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #5E7F2A"></span>Green</button>
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #7B4B2A"></span>Brown</button>
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #2A2522"></span>Black</button>
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; border-radius: 50%; background: #B42318"></span>Red</button>
          <button type="button" aria-pressed="true" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer"><span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #EDE7D9; border: 1.5px solid #B9AE95; color: #1F1A2E; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 5px #0F766E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>Pale</button>
          <button type="button" aria-pressed="false" style="display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; color: #1F1A2E; font: inherit; font-size: 11.5px; font-weight: 700; cursor: pointer"><span style="width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: #FFFFFF; border: 1.5px dashed #9C93B5; color: #5B5470; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></span>Other</button>
        </div>
      </div>

      <div role="note" aria-labelledby="notice-title" style="display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 18px; background: #FFF1D6; border: 1px solid #F2CF8C; color: #4A2A00">
        <div style="display: flex; align-items: flex-start; gap: 10px">
          <svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" style="margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5"></path><path d="M12 8h.01"></path></svg>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <span id="notice-title" style="font-size: 15px; font-weight: 800">Worth a call to Maya's doctor</span>
            <span style="font-size: 14px; line-height: 1.4">Pale, white or clay-colored stool in a baby should be reported to your baby's doctor promptly, especially with yellow skin or eyes.</span>
          </span>
        </div>
        <button type="button" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #C99A4B; background: #FFFFFF; color: #4A2A00; font: inherit; font-size: 14px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 21V4"></path><path d="M5 4h11l-2 4 2 4H5"></path></svg>Flag for doctor</button>
      </div>

      <button type="button" aria-expanded="false" style="min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: none; border-radius: 16px; background: #F5F1FC; color: #1F1A2E; font: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 800">Add details</span>
          <span style="font-size: 13px; color: #5B5470">Size, rash, blowout, note</span>
        </span>
        <svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <footer style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 28px 20px; border-top: 1px solid #EEE9F7">
      <button type="button" aria-label="Time: now. Change time" style="min-height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFC6E3; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Now<svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <a href="18-home-baby.html" style="flex: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1F1A2E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Save</a>
    </footer>
  </section>
</div>
</div>
</body>
