<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>S03 Log eating, meal · Behavior Logger mockup</title>
<!-- Design mockup (Log eating, Leo). Reference for layout, sizes, colors and copy; not production code. Spec: docs/DESIGN.md · Screen notes: docs/SCREENS.md, S03 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1A2E}a:hover{color:#000000}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>
html{background:#E7E3EE}
body{margin:0 !important;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 32px;box-sizing:border-box;background:#E7E3EE !important;font-family:'Nunito',system-ui,sans-serif}
.mock-bar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#3D3654}
.mock-bar a{color:#3B21B8;font-weight:800;text-decoration:none}
.mock-bar b{color:#1F1A2E}
.mock-frame{flex:none;box-shadow:0 10px 30px rgba(31,26,46,.18);border-radius:28px;overflow:hidden}
</style>
</head>
<body>
<div class="mock-bar"><a href="index.html">All screens</a><span><b>S03</b> · Log eating, meal · MVP</span></div>
<div class="mock-frame" data-screen="S03">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F1FC; color: #1F1A2E; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31, 26, 46, 0.42)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 32px 32px 0 0">
    <div aria-hidden="true" style="width: 40px; height: 5px; flex: none; align-self: center; margin-top: 10px; border-radius: 3px; background: #D9D2EA"></div>

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 4px 20px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #FFE3D3; color: #9A3412; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 3v6a2 2 0 0 0 4 0V3"></path><path d="M8 11v10"></path><path d="M16.5 3c-1.7 0-3 2-3 4.5s1.3 4.5 3 4.5 3-2 3-4.5-1.3-4.5-3-4.5z"></path><path d="M16.5 12v9"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 id="sheet-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.1">Eating</h1>
          <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: #5B5470"><span style="width: 10px; height: 10px; border-radius: 50%; background: #5B3BE6"></span>for Leo</span>
        </div>
      </div>
      <a href="01-home.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #F5F1FC; color: #1F1A2E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 0 20px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">What kind?</h2>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <button type="button" aria-pressed="true" style="min-height: 64px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 20px; border: 1.5px solid #5B3BE6; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Meal</button>
          <button type="button" aria-pressed="false" style="min-height: 64px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Snack</button>
          <button type="button" aria-pressed="false" style="min-height: 64px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer">Drink</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; justify-content: space-between">
          <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">Which meal?</h2>
          <span style="font-size: 13px; color: #5B5470">Picked by time of day</span>
        </div>
        <div style="display: flex; gap: 8px">
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Breakfast</button>
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Lunch</button>
          <button type="button" aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1px solid #5B3BE6; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Dinner</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">How much did Leo eat?</h2>
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">
            <svg class="i" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color: #5B5470"><circle cx="12" cy="12" r="10"></circle></svg>None
          </button>
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">
            <svg class="i" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color: #5B5470"><circle cx="12" cy="12" r="10"></circle><path d="M12 12L12 5A7 7 0 0 1 19 12Z" style="fill: #EE8A5A; stroke: none"></path></svg>A little
          </button>
          <button type="button" aria-pressed="true" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; border: 2px solid #5B3BE6; background: #E8E4FC; color: #3B21B8; font: inherit; font-size: 12.5px; font-weight: 800; cursor: pointer">
            <svg class="i" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color: #5B5470"><circle cx="12" cy="12" r="10"></circle><path d="M12 12L12 5A7 7 0 0 1 12 19Z" style="fill: #EE8A5A; stroke: none"></path></svg>Half
          </button>
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">
            <svg class="i" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color: #5B5470"><circle cx="12" cy="12" r="10"></circle><path d="M12 12L12 5A7 7 0 1 1 5 12Z" style="fill: #EE8A5A; stroke: none"></path></svg>Most
          </button>
          <button type="button" aria-pressed="false" style="min-height: 76px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer">
            <svg class="i" viewBox="0 0 24 24" width="36" height="36" aria-hidden="true" style="color: #5B5470"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="7" style="fill: #EE8A5A; stroke: none"></circle></svg>All
          </button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font-size: 14px; font-weight: 800; color: #5B5470">Foods</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <button type="button" aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1px solid #5B3BE6; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Pasta</button>
          <button type="button" aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1px solid #5B3BE6; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Carrots</button>
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Chicken</button>
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Apple slices</button>
          <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #E2DBF0; background: #F5F1FC; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Yogurt</button>
          <button type="button" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1.5px dashed #9C93B5; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add food</button>
        </div>
      </div>

      <button type="button" aria-expanded="false" style="min-height: 52px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: none; border-radius: 16px; background: #F5F1FC; color: #1F1A2E; font: inherit; text-align: left; cursor: pointer">
        <span style="flex: 1; display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 15px; font-weight: 800">Add details</span>
          <span style="font-size: 13px; color: #5B5470">Food groups, new food, reactions, note</span>
        </span>
        <svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>

    <footer style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 28px 20px; border-top: 1px solid #EEE9F7">
      <button type="button" aria-label="Time: now. Change time" style="min-height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1px solid #CFC6E3; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Now<svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></button>
      <a href="01-home.html" style="flex: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1F1A2E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Save</a>
    </footer>
  </section>
</div>
</div>
</body>
