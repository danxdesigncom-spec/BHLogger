<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S21 Create a profile (onboarding step 1) · Behavior Logger mockup</title>
<!-- Design mockup (Create a profile). Reference for layout, sizes, colors and copy; not production code. Spec: docs/DESIGN.md · Screen notes: docs/SCREENS.md, S21 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1A2E}a:hover{color:#000000}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>
html{background:#E7E3EE}
body{margin:0 !important;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 32px;box-sizing:border-box;background:#E7E3EE !important;font-family:'Nunito',system-ui,sans-serif}
.mock-bar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#3D3654}
.mock-bar a{color:#3B21B8;font-weight:800;text-decoration:none}
.mock-bar b{color:#1F1A2E}
.mock-frame{flex:none;box-shadow:0 10px 30px rgba(31,26,46,.18);border-radius:28px;overflow:hidden}
</style>
</head>
<body>
<div class="mock-bar"><a href="index.html">All screens</a><span><b>S21</b> · Create a profile (onboarding step 1) · MVP</span></div>
<div class="mock-frame" data-screen="S21">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F1FC; color: #1F1A2E; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div style="padding: 24px 20px 0 20px; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 13px; font-weight: 800; color: #5B5470">Step 1 of 3</span>
    <div role="progressbar" aria-label="Setup progress" aria-valuemin="1" aria-valuemax="3" aria-valuenow="1" style="height: 8px; border-radius: 4px; background: #E2DBF0"><div style="width: 33%; height: 8px; border-radius: 4px; background: #5B3BE6"></div></div>
  </div>

  <div style="padding: 18px 20px 0 20px; display: flex; flex-direction: column; gap: 4px">
    <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 30px; font-weight: 600; line-height: 1.1">Who are you caring for?</h1>
    <span style="font-size: 14px; color: #5B5470">You can add more people later.</span>
  </div>

  <form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 18px 20px 0 20px; overflow: hidden">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="person-name" style="font-size: 14px; font-weight: 800; color: #5B5470">Name</label>
      <input id="person-name" type="text" value="Leo" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #CFC6E3; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 17px; font-weight: 700">
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 800; color: #5B5470">Age group</legend>
      <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
        <input type="radio" name="stage" style="width: 22px; height: 22px; margin: 0; accent-color: #5B3BE6">
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Baby</span><span style="font-size: 13px; color: #5B5470">Up to 12 months · diapers and feeds</span></span>
      </label>
      <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 20px; border: 2px solid #5B3BE6; background: #E8E4FC; cursor: pointer">
        <input type="radio" name="stage" checked style="width: 22px; height: 22px; margin: 0; accent-color: #5B3BE6">
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Child</span><span style="font-size: 13px; color: #3D3654">1 to 12 years</span></span>
      </label>
      <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
        <input type="radio" name="stage" style="width: 22px; height: 22px; margin: 0; accent-color: #5B3BE6">
        <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Teen or adult</span><span style="font-size: 13px; color: #5B5470">13 and up</span></span>
      </label>
      <button type="button" style="align-self: flex-start; min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 4px; border: none; background: transparent; color: #3B21B8; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>Add a birthday instead (optional)</button>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="bath-label" style="font-size: 14px; font-weight: 800; color: #5B5470">Bathroom</span>
      <div role="group" aria-labelledby="bath-label" style="display: flex; flex-wrap: wrap; gap: 8px">
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DBF0; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Diapers</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid #E2DBF0; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Learning</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 14px; border-radius: 999px; border: 1px solid #5B3BE6; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Uses the toilet</button>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="color-label" style="font-size: 14px; font-weight: 800; color: #5B5470">Profile color</span>
      <div role="group" aria-labelledby="color-label" style="display: flex; gap: 12px">
        <button type="button" aria-pressed="true" aria-label="Violet" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #5B3BE6; color: #FFFFFF; box-shadow: 0 0 0 3px #F5F1FC, 0 0 0 5px #1F1A2E; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
        <button type="button" aria-pressed="false" aria-label="Teal" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #0F766E; cursor: pointer"></button>
        <button type="button" aria-pressed="false" aria-label="Rose" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #B4235F; cursor: pointer"></button>
        <button type="button" aria-pressed="false" aria-label="Amber" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #9A4A00; cursor: pointer"></button>
        <button type="button" aria-pressed="false" aria-label="Blue" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: #1D4F91; cursor: pointer"></button>
      </div>
    </div>
  </form>

  <footer style="flex: none; padding: 12px 20px 28px 20px">
    <a href="01-home.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1F1A2E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Continue</a>
  </footer>
</div>
</div>
</body>
</html>
