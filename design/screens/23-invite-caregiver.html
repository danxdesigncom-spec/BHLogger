<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S23 Invite a caregiver · Behavior Logger mockup</title>
<!-- Design mockup (Invite a caregiver). Reference for layout, sizes, colors and copy; not production code. Spec: docs/DESIGN.md · Screen notes: docs/SCREENS.md, S23 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1A2E}a:hover{color:#000000}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>
html{background:#E7E3EE}
body{margin:0 !important;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 32px;box-sizing:border-box;background:#E7E3EE !important;font-family:'Nunito',system-ui,sans-serif}
.mock-bar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#3D3654}
.mock-bar a{color:#3B21B8;font-weight:800;text-decoration:none}
.mock-bar b{color:#1F1A2E}
.mock-frame{flex:none;box-shadow:0 10px 30px rgba(31,26,46,.18);border-radius:28px;overflow:hidden}
</style>
</head>
<body>
<div class="mock-bar"><a href="index.html">All screens</a><span><b>S23</b> · Invite a caregiver · MVP</span></div>
<div class="mock-frame" data-screen="S23">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5F1FC; color: #1F1A2E; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(31, 26, 46, 0.42)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="sheet-title" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 32px 32px 0 0">
    <div aria-hidden="true" style="width: 40px; height: 5px; flex: none; align-self: center; margin-top: 10px; border-radius: 3px; background: #D9D2EA"></div>

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px 4px 20px">
      <div style="display: flex; align-items: center; gap: 12px">
        <span style="width: 48px; height: 48px; flex: none; border-radius: 50%; background: #E9DFFF; color: #5B21B6; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><circle cx="10" cy="8" r="4"></circle><path d="M3 20a7 7 0 0 1 14 0"></path><path d="M19 8v6M16 11h6"></path></svg></span>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <h1 id="sheet-title" style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 26px; font-weight: 600; line-height: 1.1">Invite a caregiver</h1>
          <span style="font-size: 14px; font-weight: 700; color: #5B5470">They get their own sign-in</span>
        </div>
      </div>
      <a href="22-more.html" aria-label="Close" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #F5F1FC; color: #1F1A2E; display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </header>

    <form style="flex: 1; display: flex; flex-direction: column; gap: 16px; padding: 12px 20px 0 20px; overflow: hidden">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="invite-email" style="font-size: 14px; font-weight: 800; color: #5B5470">Their email</label>
        <input id="invite-email" type="email" placeholder="name@email.com" style="min-height: 52px; box-sizing: border-box; padding: 0 16px; border-radius: 16px; border: 1.5px solid #CFC6E3; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 17px; font-weight: 700">
      </div>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 800; color: #5B5470">What can they do?</legend>
        <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; box-sizing: border-box; border-radius: 20px; border: 2px solid #5B3BE6; background: #E8E4FC; cursor: pointer">
          <input type="radio" name="role" checked style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Caregiver</span><span style="font-size: 13px; color: #3D3654">Logs and sees insights. Edits their own entries.</span></span>
        </label>
        <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; box-sizing: border-box; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
          <input type="radio" name="role" style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Viewer</span><span style="font-size: 13px; color: #5B5470">Sees and exports reports. Can't log.</span></span>
        </label>
        <label style="min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 8px 16px; box-sizing: border-box; border-radius: 20px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
          <input type="radio" name="role" style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
          <span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 16px; font-weight: 800">Admin</span><span style="font-size: 13px; color: #5B5470">Everything, including people and settings.</span></span>
        </label>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
        <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 800; color: #5B5470">Who can they see?</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <label style="min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
            <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
            <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #5B3BE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 15px; font-weight: 600">L</span>
            <span style="font-size: 16px; font-weight: 800">Leo</span>
          </label>
          <label style="min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
            <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
            <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 15px; font-weight: 600">M</span>
            <span style="font-size: 16px; font-weight: 800">Maya</span>
          </label>
        </div>
      </fieldset>

      <p style="margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5B5470"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>Invites expire after 7 days. You can remove access anytime.</p>
    </form>

    <footer style="flex: none; display: flex; align-items: center; gap: 10px; padding: 12px 20px 28px 20px; border-top: 1px solid #EEE9F7">
      <button type="button" style="min-height: 52px; display: flex; align-items: center; gap: 6px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #CFC6E3; background: #FFFFFF; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"></path><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg>Copy link</button>
      <a href="22-more.html" style="flex: 1; min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1F1A2E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Send invite</a>
    </footer>
  </section>
</div>
</div>
</body>
</html>
