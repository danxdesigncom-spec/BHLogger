<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S25 Manage a caregiver · Behavior Logger mockup</title>
<!-- Design mockup (Manage a caregiver, Dad). Reference for layout, sizes, colors and copy; not production code. Spec: docs/DESIGN.md · Screen notes: docs/SCREENS.md, S25 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&amp;family=Nunito:wght@400;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1A2E}a:hover{color:#000000}
.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style>
<style>
html{background:#E7E3EE}
body{margin:0 !important;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px 16px 32px;box-sizing:border-box;background:#E7E3EE !important;font-family:'Nunito',system-ui,sans-serif}
.mock-bar{width:100%;max-width:390px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;color:#3D3654}
.mock-bar a{color:#3B21B8;font-weight:800;text-decoration:none}
.mock-bar b{color:#1F1A2E}
.mock-frame{flex:none;box-shadow:0 10px 30px rgba(31,26,46,.18);border-radius:28px;overflow:hidden}
</style>
</head>
<body>
<div class="mock-bar"><a href="index.html">All screens</a><span><b>S25</b> · Manage a caregiver · MVP</span></div>
<div class="mock-frame" data-screen="S25">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F5F1FC; color: #1F1A2E; font-family: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif">
  <header style="display: flex; align-items: center; gap: 12px; padding: 18px 20px 4px 20px">
    <a href="22-more.html" aria-label="Back to More" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #FFFFFF; color: #1F1A2E; box-shadow: 0 1px 3px rgba(31, 26, 46, 0.10); display: flex; align-items: center; justify-content: center"><svg class="i" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
  </header>

  <div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px 0 20px">
    <span aria-hidden="true" style="width: 72px; height: 72px; flex: none; border-radius: 50%; background: #E9E3F7; color: #3D3654; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 30px; font-weight: 600">D</span>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 30px; font-weight: 600; line-height: 1.1">Dad</h1>
      <span style="font-size: 14px; line-height: 1.4; color: #5B5470">Joined Sep 3, 2026 · last logged today at 8:02 AM</span>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 22px 20px 0 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span id="role-label" style="font-size: 14px; font-weight: 800; color: #5B5470">What can they do?</span>
      <div role="group" aria-labelledby="role-label" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 3px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E2DBF0">
        <button type="button" aria-pressed="false" style="min-height: 44px; border: none; border-radius: 999px; background: transparent; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Admin</button>
        <button type="button" aria-pressed="true" style="min-height: 44px; display: flex; align-items: center; justify-content: center; gap: 4px; border: none; border-radius: 999px; background: #5B3BE6; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Caregiver</button>
        <button type="button" aria-pressed="false" style="min-height: 44px; border: none; border-radius: 999px; background: transparent; color: #1F1A2E; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Viewer</button>
      </div>
      <span style="font-size: 13px; line-height: 1.4; color: #5B5470">Caregivers log and see insights, and can edit their own entries.</span>
    </div>

    <fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column; gap: 8px">
      <legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 800; color: #5B5470">Who can they see?</legend>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
        <label style="min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
          <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #5B3BE6; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 15px; font-weight: 600">L</span>
          <span style="font-size: 16px; font-weight: 800">Leo</span>
        </label>
        <label style="min-height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 18px; border: 1.5px solid #E2DBF0; background: #FFFFFF; cursor: pointer">
          <input type="checkbox" checked style="width: 22px; height: 22px; margin: 0; flex: none; accent-color: #5B3BE6">
          <span style="width: 30px; height: 30px; flex: none; border-radius: 50%; background: #0F766E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Fredoka', 'Nunito', sans-serif; font-size: 15px; font-weight: 600">M</span>
          <span style="font-size: 16px; font-weight: 800">Maya</span>
        </label>
      </div>
    </fieldset>

    <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 20px; background: #FFFFFF; box-shadow: 0 1px 3px rgba(31, 26, 46, 0.08)">
      <button type="button" style="align-self: flex-start; min-height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-radius: 999px; border: 1.5px solid #E8A39B; background: #FFFFFF; color: #B42318; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer"><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16"></path><path d="M9 7V4h6v3"></path><path d="M6 7l1 13h10l1-13"></path></svg>Remove from household</button>
      <span style="font-size: 13px; line-height: 1.4; color: #5B5470">They lose access right away. Their past entries stay, labeled with their name.</span>
    </div>
  </div>

  <footer style="flex: none; padding: 12px 20px 28px 20px">
    <a href="22-more.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #1F1A2E; color: #FFFFFF; text-decoration: none; font-size: 17px; font-weight: 800">Save changes</a>
  </footer>
</div>
</div>
</body>
</html>
